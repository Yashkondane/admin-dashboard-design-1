<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Manage Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Unified Template Workspace */
    .template-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      height: calc(100vh - 240px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* Category Sidebar Refinement */
    .category-list {
      background: #fdfdff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .category-header {
      padding: 18px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .category-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }
    .category-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin: 2px 8px;
      border-radius: 8px;
      position: relative;
    }
    .category-item:hover { 
      background: #f1f5f9; 
    }
    .category-item.active {
      background: #eff6ff;
    }
    .category-item.active .cat-name { 
      color: var(--blue); 
      font-weight: 800; 
    }
    .category-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      background: var(--blue);
      border-radius: 0 4px 4px 0;
    }

    .cat-name { 
      font-size: 0.88rem; 
      font-weight: 700; 
      color: #475569; 
      transition: color 0.2s;
    }
    .cat-count { 
      font-size: 0.7rem; 
      font-weight: 800; 
      color: #94a3b8; 
      background: #fff; 
      padding: 2px 8px; 
      border-radius: 6px; 
      border: 1px solid #e2e8f0;
      min-width: 28px;
      text-align: center;
    }
    .category-item.active .cat-count { 
      background: var(--blue); 
      color: #fff; 
      border-color: var(--blue);
    }

    /* Template Main Workspace */
    .templates-main {
      background: #fff;
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
    }
    .workspace-header {
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
      flex-shrink: 0;
    }
    .template-scroll {
      flex: 1;
      overflow-y: auto;
    }

    .template-card {
      padding: 16px 24px;
      border-bottom: 1px solid #f8fafc;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      transition: all 0.2s;
    }
    .template-card:hover { 
      background: #f8fafc; 
    }
    .template-info { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
    }
    .template-title { 
      font-size: 0.92rem; 
      font-weight: 800; 
      color: #1e293b; 
    }
    .template-meta { 
      font-size: 0.75rem; 
      font-weight: 600; 
      color: #94a3b8; 
      display: flex; 
      gap: 12px; 
      align-items: center;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .status-dot.active { background: #10b981; }
    
    .template-actions { 
      display: flex; 
      gap: 10px; 
    }
    .action-btn-sm { 
      width: 34px; 
      height: 34px; 
      border-radius: 8px; 
      border: 1px solid #e2e8f0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      color: #64748b; 
      background: #fff;
      transition: all 0.2s;
    }
    .action-btn-sm:hover { 
      background: #f1f5f9; 
      color: var(--blue); 
      border-color: #cbd5e1; 
    }

    /* Action Buttons in Workspace */
    .ws-action-btn {
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ws-btn-primary {
      background: var(--blue);
      color: #fff;
      border: none;
    }
    .ws-btn-primary:hover {
      background: var(--blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .ws-btn-outline {
      background: #fff;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
    }
    .ws-btn-outline:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    
    /* Refined Empty State */
    .empty-state {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100%; 
      color: #94a3b8; 
      text-align: center; 
      padding: 60px;
      animation: pm-fade-in 0.4s ease;
    }
    .empty-icon-wrap {
      width: 80px;
      height: 80px;
      background: #f8fafc;
      border-radius: 24px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      color: #cbd5e1;
    }

    @keyframes pm-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle-tab" id="sidebar-toggle" title="Toggle sidebar">
      <span class="material-icons-round" id="sidebar-toggle-icon">chevron_left</span>
    </button>
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="3" fill="#4880FF" />
            <rect x="16" y="2" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="2" y="16" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="16" y="16" width="10" height="10" rx="3" fill="#4880FF" />
          </svg></div>
        <span class="brand-name">AdminPanel</span>
      </div>
      <div class="nav-section-label">MAIN MENU</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item"><span class="material-icons-round">grid_view</span><span class="nav-label">Dashboard</span></a>
        <a href="index.html" class="nav-item" id="nav-members">
          <span class="material-icons-round">people</span><span class="nav-label">Members</span><span class="nav-badge">15</span>
        </a>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">credit_card</span><span class="nav-label">Plans &amp; Billing</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="plans.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Membership Plans</a>
            <a href="labels.html" class="nav-sub-item"><span class="nav-sub-dot"></span>App Membership Label</a>
            <a href="invoice.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Invoice</a>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">chat_bubble_outline</span><span class="nav-label">Communication</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="email.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Send Email</a>
            <a href="notifications.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Notifications</a>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">assignment</span><span class="nav-label">Requests</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="profile-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Profile Request</a>
            <a href="call-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Call Request</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">settings</span><span class="nav-label">Settings</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub" style="height: auto;">
            <a href="settings-fields.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Field Setting</a>
            <a href="settings-templates.html" class="nav-sub-item nav-sub-item--active"><span class="nav-sub-dot"></span>Templates</a>
          </div>
        </div>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <a href="#" class="nav-item logout-item"><span class="material-icons-round">logout</span><span class="nav-label">Log out</span></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menu-toggle"><span class="material-icons-round">menu</span></button>
      </div>
      <div class="top-bar-right">
        <button class="header-icon-btn"><span class="material-icons-round">mail_outline</span><span class="notif-dot"></span></button>
        <button class="header-icon-btn"><span class="material-icons-round">notifications_none</span></button>
        <div class="header-user">
          <img class="header-user-avatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Jane Cooper">
          <div class="header-user-info"><span class="header-user-name">Jane Cooper</span><span class="header-user-email">jane234@example.com</span></div>
          <span class="material-icons-round header-user-arrow">expand_more</span>
        </div>
      </div>
    </header>

    <div id="templates-view" style="max-width: 1400px; margin: 0 auto; width: 100%;">
      <div class="page-title-row" style="margin-bottom: 24px;">
        <h1 class="page-title">Manage Templates</h1>
      </div>

      <div class="tabs-container" style="margin-bottom: 20px;">
        <button class="tab-item active" id="tab-email" onclick="switchType('email')">
          Email Templates
        </button>
        <button class="tab-item" id="tab-notification" onclick="switchType('notification')">
          Notification Templates
        </button>
      </div>

      <div class="template-grid">
        <!-- Categories Panel -->
        <div class="category-list">
          <div class="category-header">
            <span style="font-size: 0.72rem; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em;">Categories</span>
            <button class="ws-action-btn ws-btn-outline" onclick="openCategoryModal()" title="New Category">
              <span class="material-icons-round" style="font-size: 16px;">add</span>
            </button>
          </div>
          <div id="categories-container" class="category-scroll custom-scrollbar">
            <!-- Categories will be rendered here -->
          </div>
        </div>

        <!-- Template Workspace -->
        <div class="templates-main">
          <div class="workspace-header">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="selected-cat-label" style="font-size: 0.95rem; font-weight: 800; color: #1e293b;">Select a category</span>
              <span id="tpl-count-badge" style="font-size: 0.72rem; font-weight: 700; color: #94a3b8; background: #f1f5f9; padding: 2px 8px; border-radius: 4px; display:none;"></span>
            </div>
            <button id="create-tpl-btn" class="ws-action-btn ws-btn-primary" onclick="openTemplateModal()" style="display:none;">
              <span class="material-icons-round" style="font-size: 18px;">add</span> Create Template
            </button>
          </div>
          <div id="templates-container" class="template-scroll custom-scrollbar">
            <!-- Templates will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-container" class="modal-overlay hidden"><div class="modal-content" id="modal-content" style="max-width: 650px;"></div></div>
  <div id="toast-container" class="toast-container"></div>
  
  <script src="script.js"></script>
  <script src="templates.js"></script>
</body>
</html>
