<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Membership Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <!-- Collapse/Expand tab on right edge -->
    <button class="sidebar-toggle-tab" id="sidebar-toggle" title="Toggle sidebar">
      <span class="material-icons-round" id="sidebar-toggle-icon">chevron_left</span>
    </button>
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="3" fill="#4880FF" />
            <rect x="16" y="2" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="2" y="16" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="16" y="16" width="10" height="10" rx="3" fill="#4880FF" />
          </svg></div>
        <span class="brand-name">AdminPanel</span>
      </div>

      <div class="nav-section-label">MAIN MENU</div>

      <nav class="sidebar-nav">
        <!-- Dashboard -->
        <a href="#" class="nav-item"><span class="material-icons-round">grid_view</span><span class="nav-label">Dashboard</span></a>

        <!-- Members -->
        <a href="index.html" class="nav-item" id="nav-members">
          <span class="material-icons-round">people</span>
          <span class="nav-label">Members</span>
          <span class="nav-badge">15</span>
        </a>

        <!-- Plans & Billing -->
        <div class="nav-group open">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">credit_card</span>
            <span class="nav-label">Plans &amp; Billing</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub" style="height: auto;">
            <a href="plans.html" class="nav-sub-item nav-sub-item--active"><span class="nav-sub-dot"></span>Membership Plans</a>
            <a href="labels.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Plan Labels</a>
            <a href="invoice.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Invoice</a>
          </div>
        </div>

        <!-- Communication -->
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">chat_bubble_outline</span>
            <span class="nav-label">Communication</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="email.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Send Email</a>
            <a href="notifications.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Notifications</a>
          </div>
        </div>

        <!-- Requests -->
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">assignment</span>
            <span class="nav-label">Requests</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="profile-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Profile Request</a>
            <a href="call-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Call Request</a>
          </div>
        </div>

        <!-- Settings -->
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">settings</span>
            <span class="nav-label">Settings</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="settings-fields.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Field Setting</a>
          </div>
        </div>

        <!-- Employees (temp) -->
        <a href="employees.html" class="nav-item" id="nav-employees" style="opacity:0.5;">
          <span class="material-icons-round">badge</span>
          <span class="nav-label">Employees</span>
        </a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <a href="#" class="nav-item logout-item"><span class="material-icons-round">logout</span><span class="nav-label">Log out</span></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menu-toggle"><span class="material-icons-round">menu</span></button>
        <div class="top-bar-search"><span class="material-icons-round">search</span><input type="text"
            placeholder="Search Plans" id="top-search-input"></div>
      </div>
      <div class="top-bar-right">
        <button class="header-icon-btn"><span class="material-icons-round">mail_outline</span><span
            class="notif-dot"></span></button>
        <button class="header-icon-btn"><span class="material-icons-round">notifications_none</span></button>
        <div class="header-user">
          <img class="header-user-avatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Jane Cooper">
          <div class="header-user-info"><span class="header-user-name">Jane Cooper</span><span
              class="header-user-email">jane234@example.com</span></div>
          <span class="material-icons-round header-user-arrow">expand_more</span>
        </div>
      </div>
    </header>

    <div id="plans-view" style="background: transparent;">
      <div class="page-title-row">
        <h1 class="page-title">Membership Plans</h1>
        <div class="page-title-actions">
          <button class="btn-outline"><span class="material-icons-round">ios_share</span> Export</button>
          <button class="btn-primary" onclick="openAddPlanModal()"><span class="material-icons-round">add</span> Create New Plan</button>
        </div>
      </div>
      
      <!-- Grid format matching employees bubble format -->
      <div id="plans-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding-bottom: 24px;">
        <!-- Filled by plans.js -->
      </div>
    </div>
  </main>

  <div id="modal-container" class="modal-overlay hidden"><div class="modal-content" id="modal-content"></div></div>
  <div id="toast-container" class="toast-container"></div>
  <script src="plans.js"></script>
</body>
</html>
