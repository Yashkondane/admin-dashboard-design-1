<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Employees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="10" height="10" rx="3" fill="#4880FF"/><rect x="16" y="2" width="10" height="10" rx="3" fill="#F9A825"/><rect x="2" y="16" width="10" height="10" rx="3" fill="#F9A825"/><rect x="16" y="16" width="10" height="10" rx="3" fill="#4880FF"/></svg></div>
        <span class="brand-name">AdminPanel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item"><span class="material-icons-round">grid_view</span><span class="nav-label">Dashboard</span></a>
        <a href="index.html" class="nav-item" id="nav-members"><span class="material-icons-round">people</span><span class="nav-label">Members</span></a>
        <a href="employees.html" class="nav-item active" id="nav-employees"><span class="material-icons-round">badge</span><span class="nav-label">Employees</span></a>
        <a href="#" class="nav-item"><span class="material-icons-round">assignment_turned_in</span><span class="nav-label">Approvals</span></a>
        <a href="#" class="nav-item"><span class="material-icons-round">receipt_long</span><span class="nav-label">Invoices</span></a>
        <a href="#" class="nav-item"><span class="material-icons-round">bar_chart</span><span class="nav-label">Analytics</span></a>
        
        <div class="nav-group"><button class="nav-item nav-toggle" aria-expanded="false"><span class="material-icons-round">settings</span><span class="nav-label">Setting</span><span class="material-icons-round nav-arrow">expand_more</span></button></div>
        <a href="#" class="nav-item"><span class="material-icons-round">help_outline</span><span class="nav-label">Help Center</span></a>
      </nav>
    </div>
    <div class="sidebar-bottom"><a href="#" class="nav-item logout-item"><span class="material-icons-round">logout</span><span class="nav-label">Log out</span></a></div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menu-toggle"><span class="material-icons-round">menu</span></button>
        <div class="top-bar-search"><span class="material-icons-round">search</span><input type="text" placeholder="Search" id="top-search-input"></div>
      </div>
      <div class="top-bar-right">
        <button class="header-icon-btn"><span class="material-icons-round">mail_outline</span><span class="notif-dot"></span></button>
        <button class="header-icon-btn"><span class="material-icons-round">notifications_none</span></button>
        <div class="header-user">
          <img class="header-user-avatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Jane Cooper">
          <div class="header-user-info"><span class="header-user-name">Jane Cooper</span><span class="header-user-email">jane234@example.com</span></div>
          <span class="material-icons-round header-user-arrow">expand_more</span>
        </div>
      </div>
    </header>

    <div id="employee-view" style="background: transparent;">
      <div class="page-title-row">
        <h1 class="page-title">Employee</h1>
        <div class="page-title-actions">
          <div class="showing-select"><span>Showing</span><select id="rows-per-page"><option value="10" selected>10</option><option value="20">20</option></select></div>
          <button class="btn-outline"><span class="material-icons-round">filter_alt</span> Filter</button>
          <button class="btn-outline"><span class="material-icons-round">ios_share</span> Export</button>
          <button class="btn-primary"><span class="material-icons-round">add</span> Add New Employee</button>
        </div>
      </div>

      <div class="employee-grid" id="employee-grid">
        <!-- Employee cards injected here via JS -->
      </div>
      
      <div class="table-footer">
        <button class="page-btn nav-text-btn" id="prev-page"><span class="material-icons-round">chevron_left</span> Previous</button>
        <div class="pagination" id="pagination-controls"></div>
        <button class="page-btn nav-text-btn" id="next-page">Next <span class="material-icons-round">chevron_right</span></button>
      </div>
    </div>

    <div id="profile-view" class="profile-view hidden"></div>
  </main>

  <div id="modal-container" class="modal-overlay hidden"><div class="modal-content" id="modal-content"></div></div>
  <div id="toast-container" class="toast-container"></div>
  <script src="employees.js"></script>
</body>
</html>
