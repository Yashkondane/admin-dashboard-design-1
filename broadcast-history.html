<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Broadcast History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="dashboard.css?v=2">
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle-tab" id="sidebar-toggle" title="Toggle sidebar">
      <span class="material-icons-round" id="sidebar-toggle-icon">chevron_left</span>
    </button>
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="3" fill="#4880FF" />
            <rect x="16" y="2" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="2" y="16" width="10" height="10" rx="3" fill="#F9A825" />
            <rect x="16" y="16" width="10" height="10" rx="3" fill="#4880FF" />
          </svg></div>
        <span class="brand-name">AdminPanel</span>
      </div>
      <div class="nav-section-label">MAIN MENU</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="material-icons-round">grid_view</span><span class="nav-label">Dashboard</span></a>
        <a href="index.html" class="nav-item" id="nav-members">
          <span class="material-icons-round">people</span>
          <span class="nav-label">Members</span>
          <span class="nav-badge">15</span>
        </a>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">credit_card</span>
            <span class="nav-label">Plans &amp; Billing</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="plans.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Membership Plans</a>
            <a href="labels.html" class="nav-sub-item"><span class="nav-sub-dot"></span>App Membership Label</a>
            <a href="invoice.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Invoice</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">chat_bubble_outline</span>
            <span class="nav-label">Communication</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub" style="height: auto;">
            <a href="email.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Send Email</a>
            <a href="notifications.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Notifications</a>
            <a href="broadcast-history.html" class="nav-sub-item nav-sub-item--active"><span class="nav-sub-dot"></span>Broadcast History</a>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">assignment</span>
            <span class="nav-label">Requests</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="contact-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Contact Request</a>
            <a href="call-requests.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Call Request</a>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-toggle" onclick="toggleNavGroup(this)">
            <span class="material-icons-round">settings</span>
            <span class="nav-label">Settings</span>
            <span class="material-icons-round nav-chevron">expand_more</span>
          </button>
          <div class="nav-sub">
            <a href="settings-fields.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Field Setting</a>
            <a href="settings-templates.html" class="nav-sub-item"><span class="nav-sub-dot"></span>Templates</a>
          </div>
        </div>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <a href="#" class="nav-item logout-item"><span class="material-icons-round">logout</span><span class="nav-label">Log out</span></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menu-toggle"><span class="material-icons-round">menu</span></button>
        <div class="top-bar-search"><span class="material-icons-round">search</span><input type="text"
            placeholder="Search broadcast history…" id="top-search-input"></div>
      </div>
      <div class="top-bar-right">
        <button class="header-icon-btn"><span class="material-icons-round">mail_outline</span><span class="notif-dot"></span></button>
        <button class="header-icon-btn"><span class="material-icons-round">notifications_none</span></button>
        <div class="header-user">
          <img class="header-user-avatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Jane Cooper">
          <div class="header-user-info"><span class="header-user-name">Jane Cooper</span><span class="header-user-email">jane234@example.com</span></div>
          <span class="material-icons-round header-user-arrow">expand_more</span>
        </div>
      </div>
    </header>

    <div id="broadcast-view">
      <div class="page-title-row" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <h1 class="page-title">Broadcast History</h1>
        </div>
      </div>

      <div class="tabs-container" style="margin-bottom: 24px;">
        <button class="tab-item" data-filter="all" onclick="setBroadcastFilter('all')">
          <span>All</span>
          <span class="badge badge-all">3</span>
        </button>
        <button class="tab-item active" data-filter="approved" onclick="setBroadcastFilter('Approved')">
          <span>Live</span>
          <span class="badge badge-active">2</span>
        </button>
        <button class="tab-item" data-filter="rejected" onclick="setBroadcastFilter('Rejected')">
          <span>Reject</span>
          <span class="badge badge-inactive">1</span>
        </button>
        <button class="tab-item" data-filter="hidden" onclick="setBroadcastFilter('Hidden')">
          <span>Hide</span>
          <span class="badge badge-pending">0</span>
        </button>
      </div>

      <div class="broadcast-container" style="background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);">
        <div id="broadcast-table-container">
          <!-- Table will be injected by broadcast.js -->
        </div>
        
        <div class="table-footer" id="broadcast-footer" style="padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fafbfc;">
          <!-- Footer will be injected by broadcast.js -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-content" id="modal-content" style="max-width: 800px; padding: 0;">
      <!-- Modal content will be injected by broadcast.js -->
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="script.js?v=28"></script>
  <script src="broadcast.js?v=6"></script>
</body>

</html>
